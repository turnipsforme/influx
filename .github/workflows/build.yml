name: Build obsidian plugin

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  PLUGIN_NAME: influx # Change this to the name of your plugin-id folder

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --runInBand
      - name: Paired excerpt parser benchmark
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'aae/')
        env:
          BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/benchmark-structuredtext.cjs "$BASELINE_REF"
      - name: Incremental parser benchmark (round 3)
        if: github.event_name == 'pull_request' && github.head_ref == 'aae/influx-performance'
        # Previous measured PR head, including the long-note ordering fix.
        run: node scripts/benchmark-structuredtext.cjs 520f71e10e3bf454c5ccbe8ab9cf7ec7ddbdd857 --extended

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: 'npm'
      - name: Build
        id: build
        run: |
          npm ci
          npm run build
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}.zip ${{ env.PLUGIN_NAME }}
          ls
          echo "tag_name=$(git tag --sort version:refname | tail -n 1)" >> $GITHUB_OUTPUT

